version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - aegis_network
    restart: unless-stopped

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aegis_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: .
      target: production
    container_name: aegis_backend
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-here}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - TOURNAMENT_CONTRACT_ADDRESS=${TOURNAMENT_CONTRACT_ADDRESS}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aegis_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background worker for async tasks
  worker:
    build:
      context: .
      target: production
    container_name: aegis_worker
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-here}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - ENVIRONMENT=production
    networks:
      - aegis_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: ["python", "-m", "celery", "worker", "-A", "app.tasks", "--loglevel=info"]

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: aegis_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - aegis_network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aegis_network:
    driver: bridge

---
# Development override
version: '3.8'

services:
  # Development backend with hot reload
  backend-dev:
    build:
      context: .
      target: development
    container_name: aegis_backend_dev
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key
      - DEBUG=True
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    networks:
      - aegis_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    profiles:
      - development